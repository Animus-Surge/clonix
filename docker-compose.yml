# CloNIX testing compose file for sql database container

services:
  clonix-dbtest:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psqluser
      POSTGRES_PASSWORD: supersecurepassword123!
      POSTGRES_DB: clonix

    ports:
      - "5432:5432"


    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
